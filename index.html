<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Town Simulation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>
    <div id="controls-panel" style="position:fixed;bottom:15px;left:15px;background:rgba(0,0,0,0.7);color:#ccc;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-size:12px;padding:12px 16px;border-radius:6px;z-index:999;line-height:1.7;pointer-events:none;">
      <div style="color:#4ecdc4;font-weight:bold;margin-bottom:4px;">Controls</div>
      <div><b style="color:#fff;">WASD</b> / <b style="color:#fff;">Arrows</b> — Pan camera</div>
      <div><b style="color:#fff;">+ / -</b> — Zoom in / out</div>
      <div><b style="color:#fff;">1-9</b> — Follow agent by index</div>
      <div><b style="color:#fff;">0</b> — Deselect agent</div>
      <div><b style="color:#fff;">Space</b> — Pause / resume</div>
      <div><b style="color:#fff;">F1</b> — Toggle debug panel</div>
      <div><b style="color:#fff;">Click</b> — Select agent</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
